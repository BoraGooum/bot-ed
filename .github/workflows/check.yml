name: Check EditionCollector new articles

on:
  schedule:
    # Toutes les 15 minutes (heure UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # Permet de lancer le script manuellement depuis GitHub

permissions:
  contents: write  # Nécessaire pour autoriser le commit sur le dépôt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python check_new_articles.py

      - name: Commit updated seen files
        run: |
          git config user.name "editioncollector-bot"
          git config user.email "actions@github.com"
          git add seen_articles.json seen_promos.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update seen items [skip ci]" && git push)
