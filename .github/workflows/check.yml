name: Check New Articles

on:
  workflow_dispatch: {}

# Empêche deux runs de tourner en même temps (protection anti-doublons si
# cron-job.org et un lancement manuel se chevauchent, ou en cas de retry).
concurrency:
  group: check-new-articles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du script de vérification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python check_new_articles.py

      - name: Commit et push des fichiers de suivi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          for f in seen_articles.json seen_promos.json pointeuse.txt heartbeat_state.json article_snapshots.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update tracking files [skip ci]"
          git push
